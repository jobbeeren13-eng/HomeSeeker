<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — HomeSeeker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #00e5a0; --green-dim: rgba(0,229,160,0.10); --bg: #080b0f; --bg2: #0f1318;
      --bg3: #141920; --border: rgba(255,255,255,0.07); --text: #eef0f3; --muted: #7a8494;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
    .logo { font-size: 16px; font-weight: 800; letter-spacing: 1px; color: var(--green); text-decoration: none; text-transform: uppercase; }
    .page { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
    .user-sub { font-size: 14px; color: var(--muted); margin-bottom: 36px; }
    h2 { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
    p { font-size: 14px; line-height: 1.7; color: var(--muted); }

    /* Section layout */
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    .full-width { grid-column: 1 / -1; }

    /* Cards */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-count { font-size: 28px; font-weight: 800; color: var(--green); }
    .card-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 24px 0; }

    /* Status badges */
    .status-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-applied { background: rgba(106,180,255,0.15); color: #6ab4ff; }
    .status-viewing { background: rgba(255,179,71,0.15); color: #ffb347; }
    .status-accepted { background: rgba(0,229,160,0.15); color: var(--green); }
    .status-rejected { background: rgba(255,107,107,0.15); color: #ff6b6b; }

    /* Listing rows */
    .listing-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .listing-row:last-child { border-bottom: none; }
    .listing-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
    .listing-thumb.no-img { display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .listing-info { flex: 1; min-width: 0; }
    .listing-addr { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .listing-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .listing-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .action-btn { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 5px; background: var(--bg3); border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
    .action-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* Status selector */
    .status-select { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 5px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: inherit; cursor: pointer; }
    .status-select:focus { outline: none; border-color: rgba(0,229,160,0.4); }

    /* Tools grid */
    .tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .tool-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 14px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; transition: border-color .15s; }
    .tool-card:hover { border-color: rgba(0,229,160,0.3); }
    .tool-icon { font-size: 22px; }
    .tool-name { font-size: 12px; font-weight: 700; color: var(--text); }

    /* Loading/error states */
    .loading-state, .error-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .error-state { color: #ff6b6b; }
    .hidden { display: none !important; }

    /* Sub status nav */
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green); margin-bottom: 12px; }

    @media (max-width: 700px) {
      .dash-grid { grid-template-columns: 1fr; }
      .tools-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) { .tools-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">HomeSeeker</a>
  <span style="font-size:13px;color:var(--muted)">Dashboard</span>
</nav>

<div class="page">

  <div id="loading-state" class="loading-state">
    <div style="font-size:28px;margin-bottom:12px">📊</div>
    <div>Loading your dashboard…</div>
  </div>

  <div id="error-state" class="error-state hidden">
    <div style="font-size:28px;margin-bottom:12px">⚠️</div>
    <div id="error-msg">Something went wrong.</div>
  </div>

  <div id="main" class="hidden">

    <h1 id="user-name">My HomeSeeker</h1>
    <p class="user-sub" id="user-sub"></p>

    <div class="dash-grid">

      <!-- Saved listings -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="section-label">Saved Listings</div>
            <div class="card-count" id="fav-count">0</div>
          </div>
          <div style="font-size:22px">🔖</div>
        </div>
        <div id="fav-list"></div>
      </div>

      <!-- Application tracker -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="section-label">Applications</div>
            <div class="card-count" id="tracker-count">0</div>
          </div>
          <div style="font-size:22px">📋</div>
        </div>
        <div id="tracker-list"></div>
      </div>

      <!-- Quick tools -->
      <div class="card full-width">
        <h2>Tools</h2>
        <div class="tools-grid">
          <a href="/how-scores-work" class="tool-card">
            <div class="tool-icon">📖</div>
            <div class="tool-name">Rental Guide</div>
          </a>
          <a href="/guide/buy" class="tool-card">
            <div class="tool-icon">🏠</div>
            <div class="tool-name">Buyer Guide</div>
          </a>
          <a href="/tools/buyer-letter" class="tool-card">
            <div class="tool-icon">✉️</div>
            <div class="tool-name">Buyer Letter</div>
          </a>
          <a href="/tools/mortgage" class="tool-card">
            <div class="tool-icon">💰</div>
            <div class="tool-name">Mortgage</div>
          </a>
          <a href="/tools/bid-advisor" class="tool-card">
            <div class="tool-icon">🎯</div>
            <div class="tool-name">Bid Advisor</div>
          </a>
          <a href="/tools/legal" class="tool-card">
            <div class="tool-icon">⚖️</div>
            <div class="tool-name">Legal Process</div>
          </a>
          <a href="/tools/handover" class="tool-card">
            <div class="tool-icon">🗝</div>
            <div class="tool-name">Handover</div>
          </a>
          <a id="filters-link" href="/filters" class="tool-card">
            <div class="tool-icon">⚙️</div>
            <div class="tool-name">My Filters</div>
          </a>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
  let chatId = null;

  async function init() {
    const params = new URLSearchParams(location.search);
    chatId = params.get('chat_id');

    if (!chatId) {
      showError('No account linked. Use /dashboard in Telegram to get your personal link.');
      return;
    }

    document.getElementById('filters-link').href = `/filters?chat_id=${chatId}`;

    try {
      const resp = await fetch(`/api/dashboard?chat_id=${encodeURIComponent(chatId)}`);
      if (!resp.ok) {
        const e = await resp.json().catch(() => ({}));
        return showError(e.error || 'Dashboard not found.');
      }
      const data = await resp.json();
      render(data);
    } catch (e) {
      showError('Failed to load. Check your connection.');
    }
  }

  function render({ user, favorites, tracker }) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');

    document.getElementById('user-name').textContent = user.naam ? `Hi, ${user.naam.split(' ')[0]}` : 'My HomeSeeker';
    const sub = [user.locatie ? cap(user.locatie.replace(/-/g, ' ')) : null, user.type ? user.type : null, user.betaald ? 'Active subscription' : null].filter(Boolean).join(' · ');
    document.getElementById('user-sub').textContent = sub;

    renderFavorites(favorites);
    renderTracker(tracker);
  }

  function renderFavorites(favorites) {
    document.getElementById('fav-count').textContent = favorites.length;
    const list = document.getElementById('fav-list');
    if (!favorites.length) {
      list.innerHTML = '<div class="card-empty">No saved listings yet.<br>Tap the heart on a listing to save it.</div>';
      return;
    }
    list.innerHTML = '';
    favorites.slice(0, 8).forEach(f => {
      const l = f.listing || {};
      const row = document.createElement('div');
      row.className = 'listing-row';
      const addr = l.address || f.url;
      const meta = [l.city ? cap(l.city.replace(/-/g, ' ')) : null, l.price || null].filter(Boolean).join(' · ');
      row.innerHTML = `
        ${l.image && l.image.startsWith('http') ? `<img class="listing-thumb" src="${esc(l.image)}" onerror="this.style.display='none'" alt="" />` : `<div class="listing-thumb no-img">🏠</div>`}
        <div class="listing-info">
          <div class="listing-addr">${esc(addr)}</div>
          <div class="listing-meta">${esc(meta)}</div>
        </div>
        <div class="listing-actions">
          <a class="action-btn" href="${esc(f.url)}" target="_blank" rel="noopener">View</a>
          <button class="action-btn" onclick="removeFavorite('${esc(f.url)}', this)">Remove</button>
        </div>`;
      list.appendChild(row);
    });
  }

  function renderTracker(tracker) {
    document.getElementById('tracker-count').textContent = tracker.length;
    const list = document.getElementById('tracker-list');
    if (!tracker.length) {
      list.innerHTML = '<div class="card-empty">No applications tracked yet.<br>Add listings from your alerts.</div>';
      return;
    }
    list.innerHTML = '';
    tracker.slice(0, 8).forEach(t => {
      const row = document.createElement('div');
      row.className = 'listing-row';
      const statusOpts = ['applied','viewing','accepted','rejected'].map(s =>
        `<option value="${s}" ${t.status === s ? 'selected' : ''}>${cap(s)}</option>`
      ).join('');
      row.innerHTML = `
        ${t.image && t.image.startsWith('http') ? `<img class="listing-thumb" src="${esc(t.image)}" onerror="this.style.display='none'" alt="" />` : `<div class="listing-thumb no-img">🏠</div>`}
        <div class="listing-info">
          <div class="listing-addr">${esc(t.address || t.url)}</div>
          <div class="listing-meta">${esc(t.price || '')} &nbsp;<span class="status-badge status-${t.status}">${t.status}</span></div>
        </div>
        <div class="listing-actions">
          <select class="status-select" onchange="updateStatus('${esc(t.url)}', this.value)">${statusOpts}</select>
        </div>`;
      list.appendChild(row);
    });
  }

  async function removeFavorite(url, btn) {
    btn.disabled = true;
    btn.textContent = '...';
    try {
      await fetch('/api/favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, listing_url: url, action: 'remove' }),
      });
      btn.closest('.listing-row').remove();
      const count = parseInt(document.getElementById('fav-count').textContent) - 1;
      document.getElementById('fav-count').textContent = count;
      if (count === 0) document.getElementById('fav-list').innerHTML = '<div class="card-empty">No saved listings yet.</div>';
    } catch (e) {
      btn.textContent = 'Remove';
      btn.disabled = false;
    }
  }

  async function updateStatus(url, status) {
    await fetch('/api/application-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, listing_url: url, status }),
    });
  }

  function cap(s) { return s ? s.replace(/\b\w/g, c => c.toUpperCase()) : ''; }
  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function showError(msg) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-state').classList.remove('hidden');
  }

  init();
</script>

</body>
</html>
