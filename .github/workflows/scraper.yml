name: HomeSeeker Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger HomeSeeker scraper
        run: |
          echo "Triggering scraper at $(date)"

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST https://homeseeker.dev/api/run-scraper \
            -H "x-admin-key: ${{ secrets.ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 30)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $(cat /tmp/response.txt)"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Scraper triggered successfully"
          else
            echo "Scraper trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi
